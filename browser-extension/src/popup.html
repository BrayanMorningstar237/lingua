<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mboa Lingua</title>
<style>
  :root { --ebony: #1d1712; --ebony-2: #2a221b; --ivory: #fbf6ee; --sand: #d9c9b4; --gold: #e3a21a; --forest: #1e7a4c; --terracotta: #c2502e; --indigo: #3d4a8a;
    --card: #fffcf7; --fg: #241d16; --muted: #76675a; --line: #ebdfcd; --soft: #f6eee2;
    --kente: repeating-linear-gradient(90deg, #e3a21a 0 18px, #1e7a4c 18px 24px, #c2502e 24px 36px, #1d1712 36px 40px, #e3a21a 40px 46px, #3d4a8a 46px 52px); }
  @media (prefers-color-scheme: dark) { :root { --card: #1f1913; --fg: #f6efe4; --muted: #b7a690; --line: #3a3027; --soft: #2a221b; } }
  * { box-sizing: border-box; }
  body { margin: 0; width: 320px; font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--card); }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .band { height: 6px; background: var(--kente); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--ebony); color: var(--ivory); }
  .logo { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--gold); color: var(--ebony); }
  .logo svg { width: 20px; height: 20px; }
  header b { display: block; font-size: 16px; }
  header small { color: var(--sand); font-size: 12px; }
  main { padding: 14px 16px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  select { width: 100%; min-width: 0; }
  .switch-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); cursor: pointer; }
  .switch-row .txt { flex: 1; min-width: 0; }
  .switch-row b { display: block; }
  .switch-row small { color: var(--muted); overflow-wrap: anywhere; }
  .switch { position: relative; width: 46px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; border-radius: 99px; background: #cdbfae; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 99px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
  .switch input:checked + span { background: var(--forest); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }
  label.field { display: grid; gap: 6px; font-weight: 650; font-size: 13px; color: var(--muted); }
  select { font: inherit; color: var(--fg); padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); }
  .seg button { border: 0; border-radius: 9px; padding: 8px 4px; background: transparent; color: var(--muted); font: 600 12.5px inherit; font-family: inherit; cursor: pointer; display: grid; justify-items: center; gap: 3px; }
  .seg button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .seg kbd { font: 700 11px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 4px; background: var(--card); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 11px 10px; font: 700 13.5px inherit; font-family: inherit; cursor: pointer; }
  .btn.primary { background: var(--ebony); color: var(--ivory); }
  .btn.primary svg { color: var(--gold); }
  .btn.ghost { background: var(--soft); color: var(--fg); border: 1px solid var(--line); }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .progress { display: grid; gap: 6px; }
  .bar { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .bar .v { background: var(--forest); } .bar .t { background: var(--gold); }
  .legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 99px; margin-right: 5px; vertical-align: 0; }
  .legend .lv::before { background: var(--forest); } .legend .lt::before { background: var(--gold); }
  .link { display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: none; color: var(--muted); font: 600 13px inherit; font-family: inherit; cursor: pointer; padding: 2px; }
  .link:hover { color: var(--fg); }
</style>
</head>
<body>
<div class="band"></div>
<header>
  <div class="logo"><svg viewBox="0 0 24 24"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg></div>
  <div><b>Mboa Lingua</b><small>Banque en langues nationales</small></div>
</header>
<main>
  <label class="switch-row" for="site">
    <span class="txt"><b>Actif sur ce site</b><small id="origin"></small></span>
    <span class="switch"><input type="checkbox" id="site"><span></span></span>
  </label>

  <label class="field">Langue <select id="lang"></select></label>

  <div class="field" role="group" aria-label="Afficher la traduction">
    <span style="font-weight:650;font-size:13px;color:var(--muted)">Afficher la traduction</span>
    <div class="seg" id="hover">
      <button data-v="ctrl"><kbd>Ctrl</kbd>+ survol</button>
      <button data-v="always"><svg viewBox="0 0 24 24"><path d="M4 4l7 17 2.5-7.5L21 11 4 4z"/></svg>Survol</button>
      <button data-v="off"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m6 6 12 12"/></svg>Non</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="panel"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg>Panneau</button>
    <button class="btn ghost" id="subs"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 15h4M14 15h3M7 11h3M13 11h4"/></svg>Sous-titres</button>
  </div>

  <div class="progress" title="Phrases traduites et validées par un locuteur natif">
    <div class="bar"><i class="v" id="barV"></i><i class="t" id="barT"></i></div>
    <div class="legend"><span class="lv" id="legV"></span><span class="lt" id="legT"></span><span id="legN"></span></div>
  </div>

  <button class="link" id="opts"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M8 7h8M8 11h6"/></svg>Glossaire, voix et paramètres</button>
</main>
<script src="popup.js"></script>
</body>
</html>
