<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Langwa</title>
<style>
  :root { --ebony: #1d1712; --ebony-2: #2a221b; --ivory: #fbf6ee; --sand: #d9c9b4; --gold: #e3a21a; --forest: #1e7a4c; --terracotta: #c2502e; --indigo: #3d4a8a;
    --card: #fffcf7; --fg: #241d16; --muted: #76675a; --line: #ebdfcd; --soft: #f6eee2;
    --kente: repeating-linear-gradient(90deg, #e3a21a 0 18px, #1e7a4c 18px 24px, #c2502e 24px 36px, #1d1712 36px 40px, #e3a21a 40px 46px, #3d4a8a 46px 52px); }
  @media (prefers-color-scheme: dark) { :root { --card: #1f1913; --fg: #f6efe4; --muted: #b7a690; --line: #3a3027; --soft: #2a221b; } }
  * { box-sizing: border-box; }
  /* Chrome sizes a toolbar popup to its content and starts with a near-zero viewport, so the
     width must be fixed (vw units would collapse it). Touch phones get the full screen. */
  body { margin: 0; width: 360px; font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--card); }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .band { height: 6px; background: var(--kente); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--ebony); color: var(--ivory); }
  .logo { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--gold); color: var(--ebony); }
  .logo svg { width: 20px; height: 20px; }
  header b { display: block; font-size: 16px; }
  header small { color: var(--sand); font-size: 12px; }
  main { padding: 12px 16px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 11px; }
  html, body { overflow-x: hidden; }
  select { width: 100%; min-width: 0; }
  .switch-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: var(--soft); border: 1px solid var(--line); cursor: pointer; }
  .switch-row .txt { flex: 1; min-width: 0; }
  .switch-row b { display: block; }
  .switch-row small { color: var(--muted); overflow-wrap: anywhere; }
  .switch { position: relative; width: 46px; height: 26px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; border-radius: 99px; background: #cdbfae; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 99px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
  .switch input:checked + span { background: var(--forest); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 2px; }
  /* Local natural voice: live status (installing with progress, starting, ready). */
  .vline { display: flex; align-items: center; gap: 8px; margin-top: -4px; padding: 0 4px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .vline .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #b07a0a; animation: vp 1.1s ease-in-out infinite; }
  .vline[data-s="ready"] .dot { background: var(--forest); animation: none; }
  .vline[data-s="ready"] { color: var(--forest); font-weight: 650; }
  .vline .vbar { flex: 1; min-width: 40px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .vline .vbar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--forest), var(--gold)); transition: width 3s linear; }
  .vline:not([data-s="installing"]) .vbar { display: none; }
  @keyframes vp { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .vline .dot { animation: none; } .vline .vbar i { transition: none; } }
  label.field { display: grid; gap: 6px; font-weight: 650; font-size: 13px; color: var(--muted); }
  select { font: inherit; color: var(--fg); padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border-radius: 12px; background: var(--soft); border: 1px solid var(--line); }
  .seg button { border: 0; border-radius: 9px; padding: 8px 4px; background: transparent; color: var(--muted); font: 600 12.5px inherit; font-family: inherit; cursor: pointer; display: grid; justify-items: center; gap: 3px; }
  .seg button.on { background: var(--card); color: var(--fg); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .seg kbd { font: 700 11px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 4px; background: var(--card); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 11px 10px; font: 700 13.5px inherit; font-family: inherit; cursor: pointer; }
  .btn.primary { background: var(--ebony); color: var(--ivory); }
  .btn.primary svg { color: var(--gold); }
  .btn.ghost { background: var(--soft); color: var(--fg); border: 1px solid var(--line); }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .progress { display: grid; gap: 6px; }
  .bar { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .bar .v { background: var(--forest); } .bar .t { background: var(--gold); }
  .legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 99px; margin-right: 5px; vertical-align: 0; }
  .legend .lv::before { background: var(--forest); } .legend .lt::before { background: var(--gold); }
  .reload { display: none; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; background: color-mix(in srgb, var(--gold) 16%, var(--card)); border: 1px solid var(--gold); }
  .reload.show { display: flex; }
  .reload span { flex: 1; font-size: 13px; }
  .reload .btn { padding: 8px 12px; background: var(--gold); color: var(--ebony); }
  .linkrow { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
  .link:disabled { opacity: .45; cursor: default; }
  .link { display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: none; color: var(--muted); font: 600 13px inherit; font-family: inherit; cursor: pointer; padding: 2px; }
  .link:hover { color: var(--fg); }
  [hidden] { display: none !important; }
  .ask { display: grid; gap: 4px; }
  .ask b { font-size: 17px; }
  .ask small { color: var(--muted); }
  .lsearch-wrap { display: flex; align-items: center; gap: 9px; margin: 2px 0 2px; padding: 0 12px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); color: var(--muted); }
  .lsearch-wrap:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent); }
  .lsearch-wrap svg { width: 16px; height: 16px; }
  .lsearch-wrap input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 14px; }
  .lang-btn[hidden], .nolang[hidden] { display: none; }
  .nolang { margin: 0; padding: 14px 8px; font-size: 13px; color: var(--muted); text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
  .lang-btn .cov { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 2px; font-size: 11px; font-weight: 800; color: var(--forest); font-variant-numeric: tabular-nums; }
  .lang-btn .covbar { flex: 1; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .lang-btn .covbar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--forest), #2f9e66); }
  .langs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .lang-btn { position: relative; display: grid; min-width: 0; gap: 4px; text-align: left; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--soft); color: var(--fg); cursor: pointer; font-family: inherit; }
  .lang-btn:hover { border-color: var(--gold); }
  .lang-btn b { min-width: 0; font-size: 15.5px; overflow-wrap: anywhere; }
  .lang-btn small { min-width: 0; font-size: 11.5px; color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; }
  .lang-btn.empty b { opacity: .82; } .lang-btn.empty small { opacity: .7; }
  .btn.big { width: 100%; padding: 13px 14px; font-size: 15px; }
  .btn.big kbd { margin-left: auto; font: 700 10.5px ui-monospace, Consolas, monospace; padding: 2px 6px; border-radius: 6px; background: rgba(251,246,238,.12); color: var(--sand); }
  .btn.big.on { background: var(--gold); color: var(--ebony); } .btn.big.on svg { color: var(--ebony); } .btn.big.on kbd { background: rgba(29,23,18,.12); color: var(--ebony); }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11.5px; color: var(--muted); }
  .keys span { display: inline-flex; align-items: center; gap: 4px; }
  .keys svg { width: 13px; height: 13px; }
  .keys kbd { font: 700 10.5px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 4px; background: var(--card); color: var(--fg); }
  .lang-btn .soon { position: static; justify-self: start; max-width: 100%; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .035em; line-height: 1.35; color: #8a5a00; overflow-wrap: anywhere; }
  button, select, .switch-row { touch-action: manipulation; }
  .lang-btn { min-height: 64px; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  @media (prefers-color-scheme: dark) { .lang-btn .soon { color: var(--gold); } }
  @media (pointer: coarse) and (hover: none) { body { width: auto; } }
</style>
</head>
<body>
<div class="band"></div>
<header>
  <div class="logo"><svg viewBox="0 0 24 24"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg></div>
  <div><b>Langwa</b><small data-ui="ui_tagline">Banque en langues nationales</small></div>
</header>

<!-- First use: choose a language -->
<main id="chooser" hidden>
  <div class="ask"><b data-ui="ui_choose">Quelle langue parlez-vous ?</b><small data-ui="ui_choose_sub">Langwa affichera la banque dans cette langue.</small></div>
  <label class="lsearch-wrap"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="lsearch" autocomplete="off" spellcheck="false"></label>
  <div class="langs" id="langs"></div>
  <p class="nolang" id="nolang" hidden></p>
</main>

<main id="main" hidden>
  <label class="switch-row" for="site">
    <span class="txt"><b data-ui="ui_active">Actif sur ce site</b><small id="origin"></small></span>
    <span class="switch"><input type="checkbox" id="site"><span></span></span>
  </label>

  <div class="reload" id="reloadBox" role="status">
    <span data-ui="ui_reload_msg">Rechargez la page pour afficher les traductions.</span>
    <button class="btn" id="reload"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span data-ui="ui_reload">Recharger</span></button>
  </div>

  <label class="field"><span data-ui="ui_language">Langue</span><select id="lang"></select></label>

  <div class="field" role="group">
    <span style="font-weight:650;font-size:13px;color:var(--muted)" data-ui="ui_show">Afficher la traduction</span>
    <div class="seg" id="hover">
      <button data-v="ctrl"><kbd>Ctrl</kbd><span data-ui="ui_mode_ctrl">+ survol</span></button>
      <button data-v="always"><svg viewBox="0 0 24 24"><path d="M4 4l7 17 2.5-7.5L21 11 4 4z"/></svg><span data-ui="ui_mode_hover">Survol</span></button>
      <button data-v="off"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m6 6 12 12"/></svg><span data-ui="ui_mode_off">Non</span></button>
    </div>
  </div>

  <button class="btn primary big" id="page"><svg viewBox="0 0 24 24"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg><span data-ui="ui_page_mode">Traduire la page</span><kbd>Alt+Shift+T</kbd></button>

  <div class="actions">
    <button class="btn ghost" id="readAll"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg><span data-ui="ui_read_all">Tout lire</span></button>
    <button class="btn ghost" id="panel"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg><span data-ui="ui_panel">Panneau</span></button>
  </div>

  <label class="switch-row" for="autoRead">
    <span class="txt"><b data-ui="ui_autoread">Lecture automatique</b><small data-ui="ui_autoread_sub">Lit la traduction dès qu’elle s’affiche</small></span>
    <span class="switch"><input type="checkbox" id="autoRead"><span></span></span>
  </label>

  <label class="switch-row" for="onlineVoice">
    <span class="txt"><b data-ui="ui_online_voice">Voix naturelles en ligne</b><small data-ui="ui_online_voice_sub">Plus fluide. Le texte lu est envoyé à Microsoft ou Google.</small></span>
    <span class="switch"><input type="checkbox" id="onlineVoice"><span></span></span>
  </label>
  <div class="vline" id="vline" role="status" hidden><span class="dot"></span><span id="vlineText"></span><span class="vbar"><i id="vlineBar"></i></span></div>

  <div class="keys"><span><kbd>Ctrl</kbd> + <svg viewBox="0 0 24 24"><path d="M4 4l7 17 2.5-7.5L21 11 4 4z"/></svg></span><span><kbd>Ctrl+Espace</kbd> <span data-ui="ui_space_listen">écouter</span></span><span><kbd>Alt+Shift+L</kbd> <span data-ui="ui_read_all">Tout lire</span></span></div>

  <div class="progress" id="progress">
    <div class="bar"><i class="v" id="barV"></i><i class="t" id="barT"></i></div>
    <div class="legend"><span class="lv" id="legV"></span><span class="lt" id="legT"></span><span id="legN"></span></div>
  </div>

  <div class="linkrow">
    <button class="link" id="guide"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg><span data-ui="tour_replay">Revoir le guide</span></button>
  <button class="link" id="opts"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M8 7h8M8 11h6"/></svg><span data-ui="ui_settings">Glossaire, voix et paramètres</span></button>
  </div>
</main>
<script src="popup.js"></script>
</body>
</html>
