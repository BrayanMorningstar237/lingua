<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1712">
<title>Langwa · Aidez à traduire</title>
<style>
  :root { --ebony: #1d1712; --ebony-2: #2a221b; --ivory: #fbf6ee; --sand: #d9c9b4; --gold: #e3a21a; --gold-soft: #f6dfa6; --forest: #1e7a4c; --terracotta: #c2502e; --indigo: #3d4a8a;
    --bg: #f8f2e8; --card: #fffcf7; --fg: #241d16; --muted: #76675a; --line: #ebdfcd; --soft: #f3eadc;
    --kente: repeating-linear-gradient(90deg, #e3a21a 0 18px, #1e7a4c 18px 24px, #c2502e 24px 36px, #1d1712 36px 40px, #e3a21a 40px 46px, #3d4a8a 46px 52px); }
  @media (prefers-color-scheme: dark) { :root { --bg: #16110d; --card: #1f1913; --fg: #f6efe4; --muted: #b7a690; --line: #3a3027; --soft: #2a221b; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", sans-serif; -webkit-text-size-adjust: 100%; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  .band { height: 6px; background: var(--kente); }
  header { background: var(--ebony); color: var(--ivory); padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 2; }
  .logo { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--gold); color: var(--ebony); }
  header .t { flex: 1; min-width: 0; }
  header b { display: block; font-size: 16px; }
  header small { color: var(--sand); font-size: 12.5px; }
  .count { font-size: 13px; color: var(--sand); white-space: nowrap; }
  .progress { height: 4px; background: var(--ebony-2); }
  .progress i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .2s ease; }
  main { max-width: 640px; margin: 0 auto; padding: 18px 16px 120px; }
  h1 { font-size: 22px; margin: 6px 0 6px; }
  .lead { color: var(--muted); margin: 0 0 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; font-weight: 600; font-size: 14px; }
  .field small { font-weight: 400; color: var(--muted); }
  input[type=text], textarea { font: inherit; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: inherit; }
  textarea { min-height: 96px; resize: vertical; font-size: 18px; line-height: 1.45; }
  input:focus, textarea:focus { outline: 2px solid var(--gold); border-color: transparent; }
  .langs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .lang { text-align: left; padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); display: grid; gap: 2px; }
  .lang b { font-size: 17px; } .lang small { color: var(--muted); font-size: 12.5px; }
  .lang.on { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 12%, var(--card)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent); }
  .lang[hidden], .nolang[hidden] { display: none; }
  .lang .cov { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; font-weight: 800; color: #1e7a4c; font-variant-numeric: tabular-nums; }
  .lang .cbar { flex: 1; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .lang .cbar i { display: block; height: 100%; border-radius: inherit; background: #2f9e66; }
  .lang .need { margin-top: 6px; font-size: 11px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: #9a6a00; }
  .lang .mine { margin-top: 4px; font-size: 12px; font-weight: 700; color: var(--fg); }
  .lsearch { display: flex; align-items: center; gap: 9px; margin: 6px 0 10px; padding: 0 12px; height: 46px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); color: var(--muted); }
  .lsearch:focus-within { border-color: #e3a21a; box-shadow: 0 0 0 3px rgba(227,162,26,.25); }
  .lsearch svg { width: 18px; height: 18px; flex: none; }
  .lsearch input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 16px; }
  .nolang { margin: 0 0 18px; padding: 14px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }
  .langbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; padding: 10px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .langbar b { color: var(--fg); }
  .langbar .chg { margin-left: auto; border: 1.5px solid var(--line); background: transparent; color: var(--fg); font: 700 13.5px inherit; font-family: inherit; padding: 6px 12px; border-radius: 10px; cursor: pointer; }
  .langbar .chg:hover { border-color: #e3a21a; }
  .langbar .sendnow { display: inline-flex; align-items: center; gap: 6px; border: 0; background: #1fa855; color: #fff; font: 700 13.5px inherit; font-family: inherit; padding: 7px 12px; border-radius: 10px; cursor: pointer; }
  .langbar .sendnow svg { width: 15px; height: 15px; }
  .langbar .sendnow:disabled { opacity: .45; cursor: default; }
  .stepno { font-size: 12.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #9a6a00; margin: 4px 0 6px; }
  .backlink { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--muted); font: 600 14px inherit; font-family: inherit; padding: 6px 0; margin-bottom: 6px; cursor: pointer; }
  .backlink svg { width: 16px; height: 16px; }
  .chosen { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 18px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, #e3a21a 12%, var(--card)); border: 1.5px solid #e3a21a; color: var(--muted); font-size: 14.5px; }
  .chosen b { color: var(--fg); font-size: 16px; }
  .field small:empty { display: none; }
  .noneyet { margin: 6px 0 0; color: var(--muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 14px 18px; font-weight: 700; }
  .btn.primary { background: var(--ebony); color: var(--ivory); } .btn.primary svg { color: var(--gold); }
  .btn.gold { background: var(--gold); color: var(--ebony); }
  .btn.ghost { background: var(--soft); color: var(--fg); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .wide { width: 100%; }
  .tag { display: inline-block; font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .lg { display: flex; align-items: center; gap: 7px; margin: 10px 0 4px; font-size: 11.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .lg .flag { font: 800 10.5px ui-monospace, Consolas, monospace; letter-spacing: .04em; padding: 2px 6px; border-radius: 5px; background: var(--soft, #f4ebde); color: var(--fg, #241d16); border: 1px solid var(--line, #ebdfcd); }
  .src { font-size: 21px; font-weight: 700; line-height: 1.35; margin: 0 0 6px; }
  .en { color: var(--muted); margin: 0 0 12px; }
  .note { display: flex; gap: 10px; background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
  .note svg { color: var(--indigo); margin-top: 2px; width: 18px; height: 18px; }
  .ph { font-family: ui-monospace, Consolas, monospace; background: var(--gold-soft); color: #3b2604; padding: 0 5px; border-radius: 5px; font-size: .9em; }
  .warn { color: var(--terracotta); font-size: 13.5px; margin-top: 6px; }
  .sugg { margin: 12px 0 2px; }
  .sugg .lbl { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; margin: 0 6px 6px 0; padding: 6px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); font-size: 14px; }
  .chip i { font-style: normal; color: var(--muted); font-size: 12px; }
  a.chip { text-decoration: none; color: var(--fg); font-weight: 600; }
  a.chip::after { content: "↗"; color: var(--muted); font-size: 12px; }
  .rec { margin-top: 16px; display: grid; gap: 8px; }
  .recrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .recrow .lbl { flex: 1 1 100%; font-size: 13px; color: var(--muted); }
  .recbtn { border: 0; border-radius: 99px; padding: 10px 16px; background: var(--soft); font-weight: 700; display: inline-flex; gap: 8px; align-items: center; }
  .recbtn.on { background: var(--terracotta); color: #fff; }
  .recbtn.done { background: color-mix(in srgb, var(--forest) 14%, var(--card)); color: var(--forest); }
  details { margin-top: 14px; } summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); z-index: 2; }
  .bar .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: auto auto 1fr; gap: 8px; }
  .done-card { text-align: center; }
  .sendsteps { list-style: none; margin: 18px 0 14px; padding: 0; display: grid; gap: 12px; text-align: left; }
  .sendsteps li { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
  .sendsteps .n { flex: none; width: 28px; height: 28px; border-radius: 99px; display: grid; place-items: center; background: var(--gold, #e3a21a); color: #1d1712; font-weight: 800; font-size: 14px; }
  .sendsteps li > div { flex: 1; min-width: 0; display: grid; gap: 10px; }
  .sendsteps b { font-size: 16px; }
  .sendsteps small { color: var(--muted); font-size: 13.5px; line-height: 1.45; }
  .btn.wa { background: #1fa855; color: #fff; text-decoration: none; }
  .done-card .big { font-size: 46px; font-weight: 800; color: var(--forest); }
  .list { margin-top: 18px; display: grid; gap: 6px; }
  .row { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); text-align: left; width: 100%; }
  .row b { flex: 1; font-weight: 500; font-size: 14px; } .row span { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .row.ok span { color: var(--forest); }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ebony); color: var(--ivory); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 3; }
</style>
</head>
<body>
<div class="band"></div>
<header>
  <a class="logo" href="../" aria-label="Langwa"><svg viewBox="0 0 24 24"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg></a>
  <div class="t"><b>Langwa</b><small data-t="subtitle"></small></div>
  <div class="count" id="count"></div>
</header>
<div class="progress"><i id="prog"></i></div>

<main>
  <!-- 1. Who and which language -->
  <section id="start">
    <div class="stepno" data-t="obStep1"></div>
    <h1 data-t="title"></h1>
    <p class="lead" data-t="lead"></p>
    <div class="field" data-t="chooseLang"></div>
    <label class="lsearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="lq" autocomplete="off" spellcheck="false"></label>
    <div class="langs" id="langs"></div>
    <p class="nolang" id="nolang" hidden></p>
  </section>

  <!-- 1b. About you (after choosing the language) -->
  <section id="about" hidden>
    <button type="button" class="backlink" id="toLangs"><svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg><span data-t="change"></span></button>
    <div class="stepno" data-t="obStep2"></div>
    <h1 data-t="aboutTitle"></h1>
    <div class="chosen"><span data-t="translatingInto"></span><b id="chosenLang"></b></div>
    <label class="field"><span data-t="yourName"></span><input type="text" id="name" autocomplete="name" enterkeyhint="next"></label>
    <label class="field"><span data-t="yourTribe"></span><input type="text" id="tribe" enterkeyhint="next"><small data-t="tribeHelp"></small></label>
    <label class="field"><span data-t="yourPlace"></span><input type="text" id="place" enterkeyhint="go"><small data-t="placeHelp"></small></label>
    <button class="btn primary wide" id="go" disabled><span data-t="startTr"></span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
  </section>

  <!-- 2. One phrase per screen -->
  <section id="phrase" hidden>
    <div class="langbar"><span data-t="translatingInto"></span><b id="curLang"></b><button type="button" class="chg" id="changeLang"><span data-t="change"></span></button>
      <button type="button" class="sendnow" id="sendNow"><svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg><span id="sendNowTxt"></span></button></div>
    <div class="card">
      <span class="tag" id="group"></span>
      <div class="lg"><span class="flag">FR</span><span data-t="frLabel"></span></div>
      <p class="src" id="fr"></p>
      <div class="lg"><span class="flag">EN</span><span data-t="enLabel"></span></div>
      <p class="en" id="enTxt"></p>
      <div class="note" id="note" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span id="noteTxt"></span></div>
      <label class="field"><span id="trLabel"></span><textarea id="tr" lang="" autocapitalize="sentences"></textarea></label>
      <div class="warn" id="phWarn" hidden></div>
      <div class="sugg" id="sugg" hidden><div class="lbl" data-t="suggestions"></div><div id="chips"></div></div>
      <div class="sugg" id="refs" hidden><div class="lbl" data-t="dictionaries"></div><div id="refLinks"></div></div>
      <div class="rec" id="rec"></div>
      <details id="xBox"><summary data-t="addExplain"></summary><textarea id="x" style="min-height:60px;font-size:15px;margin-top:8px"></textarea></details>
    </div>
  </section>

  <!-- 3. Send -->
  <section id="finish" hidden>
    <div class="card done-card">
      <div class="big" id="doneCount">0</div>
      <p data-t="doneText"></p>
      <ol class="sendsteps">
        <li><span class="n">1</span><div><b data-t="step1"></b>
          <a class="btn wa wide" id="waChat" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>WhatsApp · +237 679 63 77 94</span></a></div></li>
        <li><span class="n">2</span><div><b data-t="step2"></b>
          <button class="btn gold wide" id="send"><svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg><span data-t="send"></span></button>
          <small data-t="sendHelp"></small></div></li>
      </ol>
      <button class="btn ghost wide" id="back"><span data-t="continue"></span></button>
    </div>
    <div class="list" id="list"></div>
  </section>
</main>

<div class="bar" id="nav" hidden>
  <div class="in">
    <button class="btn ghost" id="prev" aria-label="Précédent"><svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg></button>
    <button class="btn ghost" id="skip"><span data-t="skip"></span></button>
    <button class="btn primary" id="next"><span data-t="next"></span><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
  </div>
</div>

<script>
/* Data embedded by tools/build.mjs: { source, langs, terms } */
const DATA = {"source":{"about":"Source strings (French / English). Each national-language file (lang/\u003ccode>.json) maps an id to { t, verified, validator, audio }. {placeholders} are filled with the protected values from the page (amounts, names...) and MUST be kept in the translation. Strings marked \"check\": true were taken from an auto-translated view of the test page and must be compared with the page's real FR/EN text.","entries":[{"id":"gist_error","group":"safety-net","fr":"Ceci est un message d'erreur. L'opération n'a pas abouti.","en":"This is an error message. The operation did not go through.","note":"Phrase générale pour TOUTE nouvelle erreur inconnue : l’opération n’a pas marché."},{"id":"gist_warning","group":"safety-net","fr":"Avertissement de sécurité : lisez attentivement ou demandez de l'aide à une personne de confiance.","en":"Security warning: read carefully or ask someone you trust for help.","note":"Phrase générale utilisée pour TOUT nouvel avertissement de sécurité inconnu. Doit inviter à la prudence."},{"id":"gist_success","group":"safety-net","fr":"L'opération a réussi.","en":"The operation was successful."},{"id":"gist_info","group":"safety-net","fr":"Message d'information.","en":"Information message."},{"id":"gist_keywords","group":"safety-net","fr":"Mots clés :","en":"Key words:"},{"id":"test_banner","group":"test-env","fr":"Environnement de test : données fictives, aucune transaction réelle.","en":"Test environment: dummy data, no real transactions.","check":true,"variants":["Environnement de test — données fictives, aucune transaction réelle.","Test environment — dummy data, no real transactions."]},{"id":"test_protocol","group":"test-env","fr":"Protocole de test","en":"Test protocol","check":true},{"id":"back_hackathon","group":"test-env","fr":"Retour au hackathon","en":"Back to the hackathon","check":true},{"id":"online_banking","group":"test-env","fr":"Banque en ligne","en":"Online banking","check":true},{"id":"step_pay","group   $('fr').replaceChildren(...hl(p.fr));
  $('enTxt').replaceChildren(...hl(p.en));
  $('note').hidden = !p.note; $('noteTxt').textContent = p.note || '';
  $('trLabel').textContent = `${T.translationIn} ${DATA.langs[st.lang].name}`;
  $('tr').value = e.t || ''; $('tr').setAttribute('lang', st.lang);
  $('x').value = e.x || ''; $('xBox').open = !!e.x;
  const need = placeholders(p.fr);
  const checkPh = () => { const ok = !$('tr').value.trim() || placeholders($('tr').value) === need; $('phWarn').hidden = ok; $('phWarn').textContent = `${T.keep} ${need.split(',').join(' ')}`; $('next').disabled = !ok; return ok; };
  $('tr').oninput = () => { e.t = $('tr').value.trim(); checkPh(); counts(); clearTimeout(window.__s); window.__s = setTimeout(() => { persist(); renderRec(p); }, 500); };
  $('x').oninput = () => { e.x = $('x').value.trim(); persist(); };
  const sug = suggestions(p);
  $('sugg').hidden = !sug.length;
  $('chips').replaceChildren(...sug.map(s => {
    const c = el('button', { class: 'chip', type: 'button', title: s.definition }, s.term, el('i', {}, s.fr));
    c.onclick = () => { const ta = $('tr'); const pos = ta.selectionStart ?? ta.value.length; ta.value = ta.value.slice(0, pos) + s.term + ta.value.slice(pos); ta.dispatchEvent(new Event('input')); ta.focus(); };
    return c;
  }));
  const refs = (DATA.langs[st.lang] || {}).refs || [];
  $('refs').hidden = !refs.length;
  $('refLinks').replaceChildren(...refs.map(r => el('a', { class: 'chip', href: r.url, target: '_blank', rel: 'noopener' }, r.name)));
  checkPh(); renderRec(p); counts();
  $('prev').disabled = st.i === 0;
  window.scrollTo(0, 0);
}

function go(delta) {
  persist();
  if (st.i + delta >= PHRASES.length) { show('finish'); renderFinish(); return; }
  st.i += delta; renderPhrase();
}
$('next').onclick = () => { if ((st.entries[PHRASES[st.i].id] || {}).t) toast(T.saved); go(1); };
$('skip').onclick = () => go(1);
$('prev').onclick = () => go(-1);

// ---------- 3. send ----------
function payload() {
  const entries = {};
  const date = new Date().toISOString().slice(0, 10);
  for (const [id, e] of Object.entries(st.entries)) if (e.t) entries[id] = { t: e.t, x: e.x || '', audio: e.audio || '', audioParts: e.audioParts || [], by: st.name, place: st.place, tribe: st.tribe || '', date };
  return { format: 'langwa-contribution-1', code: st.lang, contributor: { name: st.name, place: st.place, tribe: st.tribe || '' }, createdAt: new Date().toISOString(), entries };
}
// Translations reach the team on WhatsApp. Contributors rarely have the team saved as a contact,
// and the share menu only offers existing chats: step 1 opens the chat (with a greeting), step 2
// shares the file into it.
const TEAM_WHATSAPP = '237679637794';
function renderFinish() {
  const n = counts();
  $('doneCount').textContent = n;
  // Any amount can be sent; with nothing translated yet, say what to do instead.
  document.querySelector('.sendsteps').hidden = !n;
  let none = document.getElementById('noneYet');
  if (!none) { none = el('p', { class: 'noneyet', id: 'noneYet' }, T.noneYet); document.querySelector('.sendsteps').after(none); }
  none.hidden = !!n;
  const lang = (DATA.langs[st.lang] || {}).name || st.lang;
  const who = `${st.name || ''}${st.place ? ` (${st.place})` : ''}`;
  const hello = EN
    ? `Hello Langwa team, I am ${who}. I translated ${n} sentences into ${lang}. I am sending you the file now.`
    : `Bonjour l’équipe Langwa, je suis ${who}. J’ai traduit ${n} phrases en ${lang}. Je vous envoie le fichier maintenant.`;
  $('waChat').href = `https://wa.me/${TEAM_WHATSAPP}?text=${encodeURIComponent(hello)}`;
  $('list').replaceChildren(el('div', { class: 'tag' }, T.all), ...PHRASES.map((p, i) => {
    const done = !!(st.entries[p.id] || {}).t;
    const r = el('button', { class: `row${done ? ' ok' : ''}`, type: 'button' }, el('b', {}, p.fr), el('span', {}, done ? `✓ ${T.translated}` : T.skipped));
    r.onclick = () => { st.i = i; show('phrase'); renderPhrase(); };
    return r;
  }));
}
$('send').onclick = async () => {
  const data = payload();
  const safe = s => (s || 'x').normalize('NFD').replace(/[^\w-]+/g, '-').slice(0, 30);
  const file = new File([JSON.stringify(data)], `langwa-${data.code}-${safe(st.name)}-${new Date().toISOString().slice(0, 10)}.json`, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Langwa', text: `Langwa · ${DATA.langs[data.code].name} · ${st.name}` }); return; } catch { /* fall back to download */ }
  }
  const a = el('a', { href: URL.createObjectURL(file), download: file.name }); document.body.append(a); a.click(); a.remove();
};
$('back').onclick = () => { show('phrase'); renderPhrase(); };
$('changeLang').onclick = () => { pick = st.lang; show('start'); renderStart(); };
$('toLangs').onclick = () => { show('start'); renderStart(); };
$('sendNow').onclick = () => { persist(); show('finish'); renderFinish(); };
// A language link opened while the page is already open (#fub): offer that language on the start screen.
addEventListener('hashchange', () => { const l = location.hash.slice(1); if (DATA.langs[l] && l !== st.lang) { pick = l; show('about'); renderAbout(); } });

function show(id) { for (const s of ['start', 'about', 'phrase', 'finish']) $(s).hidden = s !== id; $('nav').hidden = id !== 'phrase'; scrollTo({ top: 0 }); }

(async () => {
  const saved = await load('state');
  const fromLink = location.hash.slice(1); // langwa.../contribute/#fub preselects Fulfulde
  if (saved) { st = { ...st, ...saved }; st.other = st.other || {}; }
  const link = DATA.langs[fromLink] ? fromLink : '';
  if (st.lang && st.name && (!link || link === st.lang)) { show('phrase'); renderPhrase(); }
  else if (link) { pick = link; show('about'); renderAbout(); } // a language link: straight to step 2, to confirm
  else { pick = st.lang; show('start'); renderStart(); }
  counts();
})();
</script>
</body>
